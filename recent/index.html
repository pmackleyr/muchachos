<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muchachos | Recent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Syne:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="recent-page">
    <div class="bg" aria-hidden="true"></div>

    <header class="site-header" aria-label="Primary navigation">
      <a class="brand" href="../index.html">Muchachos</a>
      <nav class="nav-links" aria-label="Site links">
        <a href="../index.html">Home</a>
        <a href="./" aria-current="page">Recent</a>
        <a href="../legal.html">Legal</a>
      </nav>
    </header>

    <main class="page recent-shell">
      <section class="glass-panel content-panel recent-content" data-reveal>
        <h1>Recent Impact</h1>

        <article class="recent-entry">
          <div class="recent-meta">
            <h2>January 31, 2025</h2>
            <p>100 sandwiches donated.</p>
          </div>

          <div
            class="recent-carousel"
            data-carousel
            role="region"
            aria-label="Impact photos from January 31, 2025"
          >
            <button class="carousel-btn prev" type="button" aria-label="Previous">
              &#8249;
            </button>

            <div class="carousel-viewport" tabindex="0" aria-label="Recent impact photos" data-tilt>
              <div class="carousel-track">
                <figure class="carousel-slide is-active">
                  <img
                    src="../public/recent/recent-01.png"
                    alt="Packaged sandwiches stacked on a dining table."
                    loading="lazy"
                  />
                </figure>
                <figure class="carousel-slide">
                  <img
                    src="../public/recent/recent-02.png"
                    alt="More packaged sandwiches piled on a dining table."
                    loading="lazy"
                  />
                </figure>
                <figure class="carousel-slide">
                  <img
                    src="../public/recent/recent-03.png"
                    alt="A kitchen with sandwiches being prepared."
                    loading="lazy"
                  />
                </figure>
                <figure class="carousel-slide">
                  <img
                    src="../public/recent/recent-04.png"
                    alt="A storage bin filled with packaged sandwiches."
                    loading="lazy"
                  />
                </figure>
              </div>
            </div>

            <button class="carousel-btn next" type="button" aria-label="Next">
              &#8250;
            </button>

            <div class="carousel-dots" role="tablist" aria-label="Slides">
              <button class="carousel-dot is-active" type="button" aria-label="Slide 1"></button>
              <button class="carousel-dot" type="button" aria-label="Slide 2"></button>
              <button class="carousel-dot" type="button" aria-label="Slide 3"></button>
              <button class="carousel-dot" type="button" aria-label="Slide 4"></button>
            </div>
          </div>
        </article>
      </section>
    </main>

    <footer class="site-footer glass-panel" data-reveal>
      <span class="footer-left">@Muchachos LLC 2026</span>
      <a class="footer-right" href="../legal.html">Legal</a>
    </footer>

    <script src="../app.js" defer></script>
    <script>
      const carousels = document.querySelectorAll("[data-carousel]");

      carousels.forEach((carousel) => {
        const track = carousel.querySelector(".carousel-track");
        const viewport = carousel.querySelector(".carousel-viewport");
        const slides = Array.from(carousel.querySelectorAll(".carousel-slide"));
        const dots = Array.from(carousel.querySelectorAll(".carousel-dot"));
        const prev = carousel.querySelector(".carousel-btn.prev");
        const next = carousel.querySelector(".carousel-btn.next");
        let pointerStartX = 0;
        let pointerDeltaX = 0;
        let index = 0;

        const update = () => {
          track.style.transform = `translateX(-${index * 100}%)`;
          slides.forEach((slide, i) => {
            slide.classList.toggle("is-active", i === index);
            slide.setAttribute("aria-hidden", i === index ? "false" : "true");
          });
          dots.forEach((dot, i) => {
            dot.classList.toggle("is-active", i === index);
            dot.setAttribute("aria-current", i === index ? "true" : "false");
          });
        };

        const goTo = (nextIndex) => {
          index = (nextIndex + slides.length) % slides.length;
          update();
        };

        prev.addEventListener("click", () => goTo(index - 1));
        next.addEventListener("click", () => goTo(index + 1));
        dots.forEach((dot, dotIndex) => {
          dot.addEventListener("click", () => goTo(dotIndex));
        });

        viewport.addEventListener("keydown", (event) => {
          if (event.key === "ArrowLeft") {
            event.preventDefault();
            goTo(index - 1);
          } else if (event.key === "ArrowRight") {
            event.preventDefault();
            goTo(index + 1);
          }
        });

        viewport.addEventListener("pointerdown", (event) => {
          pointerStartX = event.clientX;
          pointerDeltaX = 0;
          viewport.setPointerCapture(event.pointerId);
        });

        viewport.addEventListener("pointermove", (event) => {
          pointerDeltaX = event.clientX - pointerStartX;
        });

        viewport.addEventListener("pointerup", (event) => {
          if (viewport.hasPointerCapture(event.pointerId)) {
            viewport.releasePointerCapture(event.pointerId);
          }
          if (Math.abs(pointerDeltaX) < 36) return;
          if (pointerDeltaX > 0) {
            goTo(index - 1);
          } else {
            goTo(index + 1);
          }
        });

        viewport.addEventListener("pointercancel", () => {
          pointerDeltaX = 0;
        });

        update();
      });
    </script>
  </body>
</html>
